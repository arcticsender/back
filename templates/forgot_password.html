{% extends 'base.html' %}
{% block title %}Forgot Password | {{ site_name }}{% endblock %}
{% block content %}
<section class="auth section compact-auth">
  <form class="panel form auth-clean frost-card elevated-auth" method="post">
    <div class="auth-logo-wrap"><img src="{{ url_for('static', filename='img/logo-app-icon.png') }}" alt=""></div>
    <div class="pill">Account recovery</div>
    <h1>Reset your password</h1>
    <p class="muted">Enter your account email and we’ll send a secure reset link. The link expires quickly for safety.</p>
    <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
    <button class="btn full">Send reset link</button>
    <p class="muted auth-footline"><a href="{{ url_for('login') }}">Back to login</a></p>
  </form>
</section>
{% endblock %}
