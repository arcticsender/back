{% extends 'base.html' %}
{% block title %}Reset Password | {{ site_name }}{% endblock %}
{% block content %}
<section class="auth section compact-auth">
  <form class="panel form auth-clean frost-card elevated-auth" method="post">
    <div class="auth-logo-wrap"><img src="{{ url_for('static', filename='img/logo-app-icon.png') }}" alt=""></div>
    <div class="pill">Secure reset</div>
    <h1>Create a new password</h1>
    <p class="muted">Use at least 10 characters with uppercase, lowercase, a number, and a symbol. After saving, you can sign in with your new password.</p>
    <label>New password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
    <label>Confirm password<input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label>
    <button class="btn full">Update password</button>
  </form>
</section>
{% endblock %}
