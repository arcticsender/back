{% extends 'base.html' %}
{% block title %}Login | {{ site_name }}{% endblock %}
{% block content %}
<section class="auth section compact-auth">
  <form class="panel form auth-clean frost-card elevated-auth" method="post">
    <div class="auth-logo-wrap"><img src="{{ url_for('static', filename='img/logo-app-icon.png') }}" alt=""></div>
    <div class="pill">Welcome back</div>
    <h1>Login</h1>
    <p class="muted">Sign in with your password. If email OTP is enabled, we’ll send a 6-digit code next.</p>
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="auth-link-row"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
    <button class="btn full">Continue</button>
    <p class="muted auth-footline">Need an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </form>
</section>
{% endblock %}
