{% extends 'base.html' %}
{% block title %}Login | {{ site_name }}{% endblock %}
{% block content %}
<section class="auth section compact-auth">
  <form class="panel form auth-clean frost-card elevated-auth" method="post">
    <div class="auth-logo-wrap"><img src="{{ url_for('static', filename='img/logo-app-icon.png') }}" alt=""></div>
    <div class="pill">Welcome back</div>
    <h1>Login</h1>
    <p class="muted">Sign in with your password. New devices are verified by email. Trusted devices can skip repeat codes.</p>
    <label>Email<input name="email" type="email" autocomplete="email" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="auth-options-row"><label class="remember-device"><input type="checkbox" name="remember_device" checked> <span><b>Remember this device</b><small>Skip email codes on this browser for 30 days.</small></span></label><a href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
    <button class="btn full">Continue</button>
    <p class="muted auth-footline">Need an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </form>
</section>
{% endblock %}
